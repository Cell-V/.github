name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
# Assign only GitHub default labels. They exist in most repositories before
# a label sync runs. GitHub does not create a missing label.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report
        Thanks for taking the time to report a bug. Please fill out the fields below so we can reproduce and resolve the issue quickly.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A short summary of the bug.
      placeholder: Describe the problem in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What happened instead? Include error messages or logs if you have them.
      render: text
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Optional. Your estimate of the impact. Maintainers set the final priority.
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: The version where you encountered the bug.
      placeholder: "e.g., 1.2.3"
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: The operating system, browser, or runtime where the bug occurred.
      placeholder: "e.g., macOS 14.5, Chrome 126, Node 20.11"
    validations:
      required: false
