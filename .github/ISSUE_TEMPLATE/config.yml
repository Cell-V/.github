# Issue template chooser configuration
# Disables blank issues for non-maintainers, so contributors pick a form or a
# contact link below.
#
# No security contact link: GitHub adds its own "Report a security
# vulnerability" entry to the chooser of every repository with a security
# policy, and it points to the affected repository.
blank_issues_enabled: false
contact_links:
  - name: Email Support
    url: https://massimoselvi.com
    about: For questions that do not fit a public channel, reach out to the maintainers at support@massimoselvi.com.
